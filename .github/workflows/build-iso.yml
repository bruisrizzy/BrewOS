# Save this file in your repository as:  .github/workflows/build-iso.yml
# It builds the BrewOS ISO on GitHub's servers whenever you push, or when you
# click "Run workflow" on the Actions tab. Needs build-brewos-iso.sh in the repo root.
name: Build BrewOS ISO

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Free up disk space (the build needs about 25 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Build the ISO
        run: sudo bash build-brewos-iso.sh

      - name: Show the end of the build log (only if something failed)
        if: failure()
        run: tail -n 120 out/build.log || true

      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: brewos-iso
          path: |
            out/*.iso
            out/*.sha256
          compression-level: 0
          if-no-files-found: error

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: out/build.log
          if-no-files-found: ignore
